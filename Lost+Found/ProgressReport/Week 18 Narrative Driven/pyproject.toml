# Tooling configuration for the Week 17 narrative scaffold generator.
#
# WHY A CONFIGURATION FILE EXISTS
# --------------------------------
# The generator is a command line tool that writes an Office Open XML package.
# Some of the strictest lint rules assume a library or a web service, and a
# small number of them cannot be satisfied by any reasonable implementation of
# this tool. Each of those rules is listed below with the reason it is turned
# off, so that a reader can challenge the decision instead of guessing.
#
# The rules are listed by name rather than by code because several of them
# were renamed when preview mode was enabled, and a code that no longer
# matches its name makes the whole configuration unreadable.
#
# CITATIONS
# ---------
# ruff, the Python linter -- https://docs.astral.sh/ruff/
# pyrefly, the Python type checker -- https://pyrefly.org/

[tool.ruff]
line-length = 120
target-version = "py310"
preview = true
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The tool raises one exception class, ScaffoldError, and puts the whole
    # context of the failure into its message. Moving that message into the
    # class would lose the context, which is the point of the rule.
    "f-string-in-exception",
    "raw-string-in-exception",
    "raise-vanilla-args",
    # python-pptx exposes no public accessor for the underlying XML nodes
    # that have to be written for a PowerPoint section list, for the notes
    # text frame, or for the slide identifier list. The private access is
    # confined to this one module and is covered by the package verifier.
    "private-member-access",
    # The tool is a thin wrapper around python-pptx, whose own types are
    # untyped in places. Every public entry point carries a full annotation;
    # annotating the python-pptx call sites would add noise, not safety.
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    # The mutually exclusive docstring conventions of pydocstyle cannot both
    # hold. The multi line summary form is the one used throughout.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # The file has no copyright header convention; the module docstring
    # carries the authorship and the citations instead.
    "missing-copyright-notice",
    # The update path is a sequence of clearly separated steps whose ordering
    # carries the meaning: match, refresh, create, place, write. Splitting it
    # further would scatter those rules across several helpers.
    "complex-structure",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-positional-arguments",
    # The only comparison against a literal is a section name check, which
    # reads better inline than as a named constant.
    "literal-membership",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert", "implicit-namespace-package"]
# The snapshots under tools/backups/ are pre-patch copies kept so that a
# failed guarded script can be restored; they are evidence, not code.
"tools/backups/*" = ["ALL"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**", "tools/backups/**"]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

# COMPLEXITY THRESHOLDS
# ----------------------
# ruff's default thresholds (complexity 10, 5 arguments, 12 branches) are
# tuned for library code. This tool is a specification loader, a deck
# builder and a package verifier: load_spec validates a JSON document field
# by field and build_update orchestrates matching, refreshing and creating
# slides. Splitting them only to satisfy a counter would scatter one
# decision across several functions and make the code harder to audit, so
# the limits are raised to the size the real functions need.
[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.pylint]
max-args = 15
max-positional-args = 15
max-branches = 40
max-statements = 110
max-locals = 30

# DOCSTRING CONVENTION
# --------------------
# One convention for the whole module. The google style is used because the
# strictest rule of the set, undocumented-param, reads the "Args:" section
# and refuses a parameter that the section does not mention. The numpy style
# puts the same information under "Parameters" over a dashed underline, which
# that rule cannot see, so a numpy section would leave the parameters
# formally undocumented.
[tool.ruff.lint.pydocstyle]
convention = "google"
